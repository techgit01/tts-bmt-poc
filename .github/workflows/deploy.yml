name: build-and-deploy

# main에 푸시되면: uv로 벤치마크 실행 → docs/ 산출물 갱신 → GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 실제 음성 산출물(docs/audio, docs/results)은 Google Colab 에서
      # Supertonic 실측으로 생성해 저장소에 커밋한다(아래 notebooks/ 참고).
      # CI 는 그 커밋된 docs/ 를 '그대로' 게시한다 — 여기서 재생성하면
      # (엔진 미설치라) 실제 음성이 시뮬레이션 톤으로 덮어써지기 때문.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
