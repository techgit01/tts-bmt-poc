name: build-and-deploy

# main에 푸시되면: uv로 벤치마크 실행 → docs/ 산출물 갱신 → GitHub Pages 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin Python (3.12 LTS)
        run: uv python pin 3.12

      - name: Sync (core deps only)
        run: uv sync

      # 엔진 미설치 → 시뮬레이션 모드로 산출물 생성 (파이프라인 검증).
      # 실제 음질 비교를 CI에서 하려면 아래에 엔진 설치 + 모델 다운로드 단계를 추가.
      - name: Run benchmark
        run: uv run tts-bmt run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
