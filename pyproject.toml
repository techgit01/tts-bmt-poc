[project]
name = "tts-bmt-poc"
version = "0.1.0"
description = "한국어 TTS 4종 벤치마크 POC (중국 제외 / 상업용 무료) — 로컬 측정 후 GitHub Pages 정적 데모로 결과 공개"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TTS BMT POC" }]

# 코어 의존성: 측정 하네스(harness) 자체는 가벼움 (stdlib + rich 만 사용).
# 실제 TTS 엔진과 오디오 I/O 는 무거우므로 optional-dependencies(extras)로 분리.
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
# 엔진별로 따로 설치 (충돌 방지). 예: uv sync --extra supertonic
# soundfile 은 실제 합성 결과의 길이 측정에 쓰이므로 각 추론 엔진과 함께 설치.
supertonic = ["supertonic>=1.3.1", "soundfile>=0.12"]
piper = ["piper-plus>=1.12.0", "soundfile>=0.12"]
# kr-custom-tts / SCE-TTS: ESPnet + KSS 사전학습 모델로 실음성 (Colab 권장 — 무거움)
espnet = ["espnet>=202412", "espnet_model_zoo>=0.1.7", "soundfile>=0.12"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tts-bmt = "tts_bmt.cli:main"

# piper-plus 와 espnet 은 pypinyin 버전이 충돌해 한 환경에 공존 불가.
# 서로 다른 엔진을 쓸 때 따로 설치하므로 상호 배타 extra 로 선언.
[tool.uv]
conflicts = [
    [{ extra = "piper" }, { extra = "espnet" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_bmt"]

[tool.ruff]
line-length = 100
target-version = "py312"
